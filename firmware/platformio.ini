; Clawd Desk firmware — ESP32-2432S028R ("Cheap Yellow Display")
;
; Two environments:
;   cyd      -> original board (micro USB, ILI9341)      <- default
;   cyd2usb  -> board with both micro USB and USB-C (ST7789)
;
; Build + upload:   pio run -e cyd -t upload
; Serial monitor:   pio device monitor

[platformio]
default_envs = cyd

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
monitor_filters = esp32_exception_decoder
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/Bodmer/U8g2_for_TFT_eSPI.git
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    bblanchon/ArduinoJson@^7.2.0
    tzapu/WiFiManager@^2.0.17
build_flags =
    -DUSER_SETUP_LOADED=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000

[env:cyd]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1

[env:cyd2usb]
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DCLAWD_INVERT=1
