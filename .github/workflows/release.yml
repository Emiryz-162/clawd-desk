# Builds ClawdDesk-Setup.exe and the firmware images, and attaches them to a
# GitHub release. Start it by pushing a tag:  git tag v0.2.0 && git push --tags
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build ClawdDesk-Setup.exe
        working-directory: companion
        run: |
          npm ci --omit=optional
          npm test
          npm run build:exe

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build firmware images
        shell: bash
        run: |
          pip install platformio esptool
          python tools/build_web_firmware.py "${GITHUB_REF_NAME}"
          for env in cyd cyd_inv cyd2usb; do
            cp "site/firmware/$env/clawd-desk.bin" "clawd-desk-$env.bin"
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            companion/dist/ClawdDesk-Setup.exe
            clawd-desk-*.bin
          generate_release_notes: true
